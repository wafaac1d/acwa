[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url = postgresql+psycopg://acwa:acwa@localhost:5432/acwa

[loggers]
keys = root
level = WARN

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
handlers = console
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stderr,)

[formatter_generic]
format = %(levelname)s %(message)s
